workflows:
  ios-flighty-everything:
    name: flighty Everything iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.wankun824.flightyeverything
    scripts:
      - name: 安装与同步
        script: |
          npm ci
          npx cap sync ios
      - name: 构建未签名 IPA
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p build/unsigned/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/unsigned/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/unsigned/Payload build/flighty-everything-unsigned.ipa
    artifacts:
      - build/*.ipa
      - build/ios/Build/Products/Release-iphoneos/*.app
