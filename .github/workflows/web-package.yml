name: Package Web Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact source commit to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify requested source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test -z "$REQUESTED_SOURCE_SHA" || test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm test
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build bundled native frontend
        run: npm run native:build
      - name: Package and verify source with documentation
        run: |
          python3 scripts/package-source.py
          mkdir -p build/packages
          git archive --format=zip --output=build/packages/flighty-everything-docs.zip HEAD README.md docs MODEL_LICENSES.md ios/qa/README.md
      - name: Archive frontend build outputs
        shell: bash
        run: |
          mkdir -p build/packages
          tar -czf "build/packages/flighty-everything-web-${GITHUB_SHA::7}.tar.gz" \
            dist \
            native-shell \
            public \
            package.json \
            package-lock.json \
            capacitor.config.ts \
            README.md
      - name: Upload web package
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-web
          path: build/packages/flighty-everything-web-*.tar.gz
          archive: false
          retention-days: 30
      - name: Upload verified source package
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-source
          path: |
            release/source/*.zip
            release/source/*.sha256
          retention-days: 30
      - name: Upload documentation on explicit request
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-docs
          path: build/packages/flighty-everything-docs.zip
          archive: false
          retention-days: 30
