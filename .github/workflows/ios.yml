name: Package iOS Client

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to verify before packaging
        required: false
        type: string
      unsigned_only:
        description: Only export unsigned packages without using signing credentials
        required: true
        default: true
        type: boolean
      export_method:
        description: Signed export method
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - app-store-connect
          - debugging
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      EXPORT_METHOD: ${{ inputs.export_method || 'release-testing' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify requested source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test -z "$REQUESTED_SOURCE_SHA" || test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_SHA"
      - name: Verify Apple Silicon and iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${IOS_SDK_VERSION%%.*}" = "27"
          echo "Building on Apple Silicon with iOS SDK $IOS_SDK_VERSION"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build bundled native frontend
        run: |
          npm run native:build
          test -f native-shell/index.html
          test -d native-shell/assets
          test -f native-shell/models/legacy-plane.glb
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('native-shell/build-info.json')); if(b.sourceCommit!==process.env.GITHUB_SHA) throw Error('Native source revision mismatch');"
          if grep -R "manyou-travel-ui-demo.*chatgpt.site" native-shell/index.html native-shell/assets; then
            echo "The native bundle must not redirect to the hosted website."
            exit 1
          fi
      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Archive iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath build/FlightyEverything-Simulator.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive
          APP_PATH="build/FlightyEverything-Simulator.xcarchive/Products/Applications/App.app"
          test -f "$APP_PATH/App"
          mkdir -p build/packages
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/packages/flighty-everything-ios-simulator.app.zip
      - name: Upload iOS Simulator package
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-ios-simulator
          path: build/packages/flighty-everything-ios-simulator.app.zip
          archive: false
          retention-days: 30

      - name: Verify Simulator full-screen layout in light and dark mode
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and "iOS" in x["name"]]; print(r[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin)["devicetypes"] if "iPhone" in x["name"]]; print(next((x["identifier"] for x in d if x["name"]=="iPhone 17 Pro"),d[-1]["identifier"]))')
          QA_DEVICE=$(xcrun simctl create "Flighty QA $GITHUB_RUN_ID" "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl shutdown "$QA_DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$QA_DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$QA_DEVICE"
          xcrun simctl bootstatus "$QA_DEVICE" -b
          xcrun simctl ui "$QA_DEVICE" appearance light
          xcrun simctl install "$QA_DEVICE" build/FlightyEverything-Simulator.xcarchive/Products/Applications/App.app
          SIMCTL_CHILD_FLIGHTY_UI_QA=1 xcrun simctl launch "$QA_DEVICE" com.wankun824.flightyeverything
          CONTAINER=$(xcrun simctl get_app_container "$QA_DEVICE" com.wankun824.flightyeverything data)
          mkdir -p build/ui-qa
          for attempt in $(seq 1 60); do
            if test -f "$CONTAINER/Documents/layout-audit.json" && python3 -c 'import json; a=json.load(open("'"$CONTAINER"'/Documents/layout-audit.json")); raise SystemExit(0 if a.get("nativeTheme")=="light" and a.get("nativeGlass") and a.get("mapReady") else 1)'; then
              break
            fi
            sleep 2
          done
          cp "$CONTAINER/Documents/layout-audit.json" build/ui-qa/layout-audit.json
          python3 -c 'import json; a=json.load(open("build/ui-qa/layout-audit.json")); v=a["viewport"]; d=a["device"]; assert abs(d["x"])<1 and abs(d["y"])<1; assert abs(d["height"]-v["height"])<1 and abs(d["width"]-v["width"])<1; assert a["nav"]["bottom"]<=v["height"]-a["safeBottom"]+1; assert a["firstRowBottom"]<=a["nav"]["top"]; assert a["nativeShell"] and a["nativeGlass"] and a["mapReady"] and not a["systemChromeDuplicates"]; assert a["rowShadow"]=="none"; print(a)'
          sleep 12
          for attempt in $(seq 1 5); do
            xcrun simctl io "$QA_DEVICE" screenshot build/ui-qa/iphone-light.png
            swift ios/qa/verifyScreenshot.swift build/ui-qa/iphone-light.png light && break
            sleep 10
          done
          swift ios/qa/verifyScreenshot.swift build/ui-qa/iphone-light.png light
          rm -f "$CONTAINER/Documents/layout-dark.json"
          xcrun simctl ui "$QA_DEVICE" appearance dark
          for attempt in $(seq 1 60); do
            if test -f "$CONTAINER/Documents/layout-dark.json" && python3 -c 'import json; a=json.load(open("'"$CONTAINER"'/Documents/layout-dark.json")); raise SystemExit(0 if a.get("nativeTheme")=="dark" and a.get("pageTheme")=="dark" and a.get("nativeGlass") and a.get("mapReady") else 1)'; then
              break
            fi
            sleep 2
          done
          cp "$CONTAINER/Documents/layout-audit.json" build/ui-qa/layout-after-switch.json
          xcrun simctl ui "$QA_DEVICE" appearance
          cp "$CONTAINER/Documents/layout-dark.json" build/ui-qa/layout-dark.json
          python3 -c 'import json; a=json.load(open("build/ui-qa/layout-dark.json")); assert a["nativeTheme"]=="dark" and a["pageTheme"]=="dark"; print(a)'
          sleep 4
          for attempt in $(seq 1 5); do
            xcrun simctl io "$QA_DEVICE" screenshot build/ui-qa/iphone-dark.png
            swift ios/qa/verifyScreenshot.swift build/ui-qa/iphone-dark.png dark && break
            sleep 10
          done
          swift ios/qa/verifyScreenshot.swift build/ui-qa/iphone-dark.png dark
          # Xcode 27 beta's Simulator WebKit GPU process is unstable when XCTest
          # takes repeated Mapbox screenshots. Interaction behavior is covered by
          # the deterministic JS suite; this native gate stays focused on running
          # iPhone geometry, safe areas, real UIKit glass and both appearances.
          cp "$CONTAINER"/Documents/layout-*.json build/ui-qa/
      - name: Upload Simulator visual checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flighty-ios-ui-qa
          path: build/ui-qa
          retention-days: 30

      - name: Build unsigned Apple Silicon device IPA
        if: always()
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FlightyEverything-Unsigned.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive
          APP_PATH="build/FlightyEverything-Unsigned.xcarchive/Products/Applications/App.app"
          test -f "$APP_PATH/App"
          test -f "$APP_PATH/public/build-info.json"
          lipo -info "$APP_PATH/App" | tee build/device-architectures.txt
          grep -q "arm64" build/device-architectures.txt
          mkdir -p build/unsigned/Payload build/packages
          ditto "$APP_PATH" build/unsigned/Payload/App.app
          (
            cd build/unsigned
            /usr/bin/zip -qry ../packages/flighty-everything-ios-arm64-unsigned.ipa Payload
          )
          unzip -t build/packages/flighty-everything-ios-arm64-unsigned.ipa
      - name: Upload unsigned device IPA
        if: always() && hashFiles('build/packages/flighty-everything-ios-arm64-unsigned.ipa') != ''
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-ios-arm64-unsigned
          path: build/packages/flighty-everything-ios-arm64-unsigned.ipa
          archive: false
          retention-days: 30

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ "${{ inputs.unsigned_only }}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Unsigned-only export requested; signing is disabled."
          elif [[ -n "$P12_BASE64" && -n "$PROFILE_BASE64" && -n "$TEAM_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured; the installable IPA step will be skipped."
          fi
      - name: Install Apple signing files
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/flighty-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/flighty-profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/flighty-signing.keychain-db"
          TEMP_KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FlightyEverything.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive
      - name: Export signed IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.wankun824.flightyeverything</key><string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/FlightyEverything.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA and symbols
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flighty-everything-ios-signed
          path: |
            build/signed/*.ipa
            build/FlightyEverything.xcarchive/dSYMs
          retention-days: 30
      - name: Clean up signing files
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
