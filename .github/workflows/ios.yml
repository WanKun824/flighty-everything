name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Signed export method
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - app-store-connect
          - debugging

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor iOS project
        run: npx cap sync ios
      - name: Build unsigned device IPA
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p build/unsigned/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/App.app build/unsigned/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/unsigned/Payload build/manyou-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/manyou-unsigned.ipa
          archive: false
          retention-days: 14
      - name: Install Apple signing files
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != '' && env.TEAM_ID != ''
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive signed app
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != '' && env.TEAM_ID != ''
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Manyou.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive
      - name: Export signed IPA
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != '' && env.TEAM_ID != ''
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.wankun824.manyou</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Manyou.xcarchive -exportPath build/signed -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != '' && env.TEAM_ID != ''
        uses: actions/upload-artifact@v7
        with:
          path: build/signed/*.ipa
          archive: false
          retention-days: 14
