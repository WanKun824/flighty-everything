name: Capture iOS Pages on Xcode
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision to compile and capture
        required: true
        type: string
      appearance:
        description: Capture both appearances on isolated runners, or retry just one
        required: true
        default: both
        type: choice
        options: [both, light, dark]
permissions:
  contents: read
jobs:
  screenshots:
    name: iPhone 17 Pro / ${{ matrix.appearance }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: ${{ fromJSON(inputs.appearance == 'light' && '["light"]' || inputs.appearance == 'dark' && '["dark"]' || '["light","dark"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Record exact build environment
        env:
          REQUESTED: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED"
          test "$(uname -m)" = "arm64"
          mkdir -p build/page-captures
          xcodebuild -version > build/page-captures/xcode-version.txt
          sw_vers > build/page-captures/macos-version.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build bundled application
        run: |
          npm ci
          npm run native:build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build/page-captures/xcode-build.log 2>&1
      - name: Run app and capture each current page
        run: python3 ios/qa/capture-pages.py --theme "${{ matrix.appearance }}"
      - name: Upload screenshots and provenance, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fly-everything-ios-page-captures-${{ matrix.appearance }}
          path: build/page-captures
          retention-days: 30
